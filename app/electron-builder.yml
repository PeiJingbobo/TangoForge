# TangoForge 打包配置（electron-builder）
# 产物目录：release/；编译输入：electron-vite 输出 out/（main/preload/renderer）
appId: com.tangoforge.app
productName: TangoForge
copyright: Copyright © 2026 TangoForge

directories:
  buildResources: build # 图标等资源（build/icon.icns / icon.ico / icon.png）
  output: release # 打包产物输出目录

# 分发与在线更新（docs/CI-CD-UPDATER.md 评审版，TF-036）：
# - GitHub Releases 为唯一分发源；electron-builder 打包时生成更新元数据
#   （macOS → latest-mac.yml、Windows → latest.yml）并随 --publish always 上传。
# - 仓库公开，electron-updater 无需内置 token。
publish:
  provider: github
  owner: PeiJingbobo
  repo: TangoForge
  releaseType: release

# 仅打包 electron-vite 编译产物与运行时清单，排除源码与配置
files:
  - out/**
  - package.json
  - '!src/**'
  - '!electron/**'
  - '!electron.vite.config.ts'
  - '!tsconfig*.json'
  - '!*.test.*'
  - '!**/*.map'

asar: true

# 内嵌守护进程 + CLI 必须随包分发：主进程 resolveDaemonPath 在打包版只查
# resources/bin/<daemon>；CLI（tangoforge）供用户在终端使用（可经
# scripts/register-cli 脚本注册到全局 PATH）。
# 打包前需先编译对应平台二进制到仓库根 bin/（见 README 后端编译命令）。
extraResources:
  - from: ../bin
    to: bin
    filter:
      - tangoforge
      - tangoforge.exe
      - tangoforge-daemon
      - tangoforge-daemon.exe
  # CLI 全局注册脚本（与二进制同目录，便于安装后直接执行）
  - from: ../scripts
    to: bin
    filter:
      - register-cli.ps1
      - register-cli.sh

# 应用图标：推荐 build/icon.icns（mac）、build/icon.ico（win）；
# 未提供时 electron-builder 使用 Electron 默认图标（仅警告不阻断）。

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
    - target: zip
  # macOS 未签名（TF-036，评审决策）：当前阶段无 Apple Developer ID 证书，
  # identity: null 跳过签名与公证；更新策略为「打开 dmg 由用户手动安装」。
  # 后续取得证书后移除本行并配置 notarize（docs/CI-CD-UPDATER.md §7.1）。
  identity: null
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

win:
  target:
    - target: nsis
    - target: portable
  # Windows 代码签名（TF-036）：CI（release.yml）内生成自签名证书并注入
  # CSC_LINK / CSC_KEY_PASSWORD 完成签名（SmartScreen 仍会提示"未知发布者"，属预期）；
  # 本地无证书时 electron-builder 自动回退（自签名/跳过，仅警告）。
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: ${productName}-${version}-setup.${ext}

dmg:
  artifactName: ${productName}-${version}.${ext}
